name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: weekly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U integration -d weekly_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Real PostgreSQL migration and concurrency checks
        run: npm run test:database
        env:
          TEST_DATABASE_URL: postgresql://integration:ephemeral-ci-only@127.0.0.1:5432/weekly_test
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build operations image
        run: docker build --target tools -t weekly-tools:ci .
      - name: Check operations runtime
        run: >-
          docker run --rm --entrypoint node weekly-tools:ci -e
          "const fs = require('node:fs');
          for (const path of ['scripts/migrate.ts', 'scripts/bootstrap-admin.ts', 'drizzle/meta/_journal.json', 'src/lib/db/schema.ts']) fs.accessSync(path);
          require.resolve('tsx/cli'); require.resolve('pg'); require.resolve('better-auth/crypto');
          if (process.getuid() === 0) throw new Error('Operations container must not run as root');"
      - name: Build web image
        run: docker build --target runner -t weekly-app:ci .
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npx next typegen && npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit tests
        run: npm test
      - name: Backup and restore failure handling
        shell: pwsh
        run: ./scripts/test-backup-restore.ps1
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Migration consistency
        run: npx drizzle-kit check
      - name: Production build
        run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
