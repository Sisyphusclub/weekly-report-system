services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    build:
      context: .
      target: runner
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &app-environment
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      APP_ENV: ${APP_ENV:-production}
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      ATTACHMENT_SCANNER_URL: ${ATTACHMENT_SCANNER_URL:?set ATTACHMENT_SCANNER_URL}
      ATTACHMENT_SCANNER_TOKEN: ${ATTACHMENT_SCANNER_TOKEN:-}
      CLAMAV_URL: ${CLAMAV_URL:?set CLAMAV_URL}
    ports:
      - "${APP_PORT:-3000}:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  tools:
    profiles: [tools]
    build:
      context: .
      target: tools
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-environment
      REMINDER_ORGANIZATION_ID: ${REMINDER_ORGANIZATION_ID:-}
      CALENDAR_YEAR: ${CALENDAR_YEAR:-2026}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  postgres-data:
